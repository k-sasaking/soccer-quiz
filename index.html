<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サッカークイズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="wrap">

  <section id="start" class="card">
    <p class="eyebrow">QUIZ</p>
    <h1>サッカークイズ</h1>
    <p class="lead">全10問・<span id="lead-mode">3択</span>。1問ずつ出題します。<br>答えを選ぶと、正解と解説が表示されます。</p>

    <fieldset class="mode">
      <legend class="mode-legend">選択肢の数</legend>
      <div class="mode-options">
        <input class="mode-input" type="radio" name="mode" id="mode-3" value="3" checked>
        <label class="mode-option" for="mode-3">3択</label>
        <input class="mode-input" type="radio" name="mode" id="mode-4" value="4">
        <label class="mode-option" for="mode-4">4択</label>
      </div>
    </fieldset>

    <button id="start-btn" class="btn btn-primary" type="button">スタート</button>
  </section>

  <section id="quiz" class="card" hidden>
    <div class="meta">
      <span id="counter" class="counter"></span>
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
    </div>

    <h2 id="question" class="question"></h2>

    <div id="choices" class="choices"></div>

    <div id="feedback" class="feedback" hidden>
      <p id="judge" class="judge"></p>
      <p id="explanation" class="explanation"></p>
      <button id="next-btn" class="btn btn-primary" type="button"></button>
    </div>
  </section>

  <section id="result" class="card" hidden>
    <p class="eyebrow">RESULT</p>
    <p class="score"><span id="score-num" class="score-num"></span><span class="score-total"> / 10問正解</span></p>
    <p id="rate" class="rate"></p>
    <ol id="review" class="review"></ol>
    <button id="retry-btn" class="btn btn-primary" type="button">もう一度挑戦する</button>
  </section>

</main>

<script src="script.js" defer></script>
</body>
</html>
