<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サッカークイズ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="wrap">

  <section id="start" class="card">
    <div class="hero" aria-hidden="true">
      <svg class="hero-svg" viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg" focusable="false">
        <defs>
          <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#0d1f14"/>
            <stop offset="1" stop-color="#061009"/>
          </linearGradient>
          <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="ballShade" cx="0.38" cy="0.32" r="0.75">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset="0.7" stop-color="#e6e6e6"/>
            <stop offset="1" stop-color="#9c9c9c"/>
          </radialGradient>
          <clipPath id="ballClip"><circle r="48"/></clipPath>
          <g id="spoke" stroke="#141414" stroke-width="2.6" stroke-linecap="round">
            <line x1="0" y1="-18" x2="0" y2="-36"/>
            <line x1="0" y1="-36" x2="10.64" y2="-40.54"/>
            <line x1="0" y1="-36" x2="-10.64" y2="-40.54"/>
          </g>
          <polygon id="patch" points="0,28 15.22,39.06 9.4,56.94 -9.4,56.94 -15.22,39.06" fill="#141414"/>
        </defs>

        <!-- ピッチ -->
        <rect x="0" y="0" width="640" height="260" fill="url(#pitch)"/>
        <g fill="#ffffff" opacity="0.035">
          <rect x="40" y="30" width="70" height="200"/>
          <rect x="180" y="30" width="70" height="200"/>
          <rect x="320" y="30" width="70" height="200"/>
          <rect x="460" y="30" width="70" height="200"/>
        </g>
        <g fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2">
          <rect x="40" y="30" width="560" height="200"/>
          <line x1="320" y1="30" x2="320" y2="230"/>
          <circle cx="320" cy="130" r="42"/>
          <rect x="40" y="75" width="84" height="110"/>
          <rect x="40" y="105" width="30" height="50"/>
          <path d="M124 105 A 34 34 0 0 1 124 155"/>
          <rect x="516" y="75" width="84" height="110"/>
          <rect x="570" y="105" width="30" height="50"/>
          <path d="M516 105 A 34 34 0 0 0 516 155"/>
        </g>
        <g fill="#ffffff" fill-opacity="0.7">
          <circle cx="98" cy="130" r="2.5"/>
          <circle cx="542" cy="130" r="2.5"/>
        </g>

        <!-- 光と影 -->
        <ellipse cx="320" cy="130" rx="150" ry="90" fill="url(#glow)"/>
        <ellipse cx="322" cy="184" rx="44" ry="8" fill="#000" opacity="0.55"/>

        <!-- ボール -->
        <g class="hero-ball" transform="translate(320 130)">
          <circle r="48" fill="url(#ballShade)"/>
          <g clip-path="url(#ballClip)">
            <polygon points="0,-18 17.12,-5.56 10.58,14.56 -10.58,14.56 -17.12,-5.56" fill="#141414"/>
            <use href="#spoke"/>
            <use href="#spoke" transform="rotate(72)"/>
            <use href="#spoke" transform="rotate(144)"/>
            <use href="#spoke" transform="rotate(216)"/>
            <use href="#spoke" transform="rotate(288)"/>
            <use href="#patch"/>
            <use href="#patch" transform="rotate(72)"/>
            <use href="#patch" transform="rotate(144)"/>
            <use href="#patch" transform="rotate(216)"/>
            <use href="#patch" transform="rotate(288)"/>
          </g>
          <circle r="48" fill="none" stroke="#141414" stroke-width="2.5"/>
        </g>
      </svg>
    </div>
    <p class="eyebrow">QUIZ</p>
    <h1>サッカークイズ</h1>
    <p class="lead">全10問・3択。1問ずつ出題します。<br>答えを選ぶと、正解と解説が表示されます。</p>
    <button id="start-btn" class="btn btn-primary" type="button">スタート</button>
  </section>

  <section id="quiz" class="card" hidden>
    <div class="meta">
      <span id="counter" class="counter"></span>
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>
    </div>

    <h2 id="question" class="question"></h2>

    <div id="choices" class="choices"></div>

    <div id="feedback" class="feedback" hidden>
      <p id="judge" class="judge"></p>
      <p id="explanation" class="explanation"></p>
      <button id="next-btn" class="btn btn-primary" type="button"></button>
    </div>
  </section>

  <section id="result" class="card" hidden>
    <p class="eyebrow">RESULT</p>
    <p class="score"><span id="score-num" class="score-num"></span><span class="score-total"> / 10問正解</span></p>
    <p id="rate" class="rate"></p>
    <ol id="review" class="review"></ol>
    <button id="retry-btn" class="btn btn-primary" type="button">もう一度挑戦する</button>
  </section>

</main>

<script src="script.js" defer></script>
</body>
</html>
